name: Validate Python course demos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-library-demos:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test Module 1 demo
        working-directory: demos/module-1-python
        run: python -m unittest discover -s tests -v

      - name: Test capstone starter
        working-directory: demos/capstone-python
        run: python -m unittest discover -s tests -v

  database-tool-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Module 4–6 demo requirements
        working-directory: demos/module-4-6-python
        run: python -m pip install -r requirements.txt

      - name: Test API and metadata provider
        working-directory: demos/module-4-6-python
        run: python -m unittest discover -s tests -v
